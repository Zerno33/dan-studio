# Strażnik: zła zmiana nie wchodzi na main (ani nie zostaje na dev),
# jeśli aplikacja w ogóle się nie buduje.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
